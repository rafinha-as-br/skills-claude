# EXEMPLO - release-manifest.yml
#
# Gerado pelo orchestrate.ps1 e incluido dentro do ZIP da distribuicao. Este
# arquivo nao e' escrito a mao - o exemplo existe para documentar o formato e
# para a pagina "Release" do Confluence saber o que copiar.
#
# O Manifest precisa responder SOZINHO a oito perguntas. Se alguma resposta nao
# sai daqui, ele esta' incompleto:
#
#   1. Qual e' a versao do produto?
#   2. Quais componentes estao dentro?
#   3. Qual a versao de cada componente?
#   4. Qual commit de cada componente foi usado?
#   5. Quais componentes foram versionados nesta release?
#   6. Quais foram carried?
#   7. Qual Runtime Package foi utilizado?
#   8. Qual Release Request originou a distribuicao?

