# EXEMPLO - release-request.yml
#
# Escrito pela jira-release-executor depois das decisoes de Rafinha, e consumido
# pelo orchestrate.ps1. Vive em .release/requests/<data>-<tipo>.yml.
#
# E' o pedido de UMA EXECUCAO - registro operacional que permite reproduzir o
# contexto daquela rodada. NAO e' registro historico do estado do produto:
# isso e' o release-manifest.yml, que viaja dentro do ZIP.

release_request:
  project: geoprag
  type: PRE_RELEASE                  # PRE_RELEASE | FINAL

  # Versao do PRODUTO. Preenchida so' em release completa; null numa parcial.
  product_version: 1.0.0-rc.1

  # Em FINAL que promove uma pre-release validada: o identificador do rc.
  # Os commits abaixo passam a vir do release-manifest.yml daquele rc, nao do
  # HEAD da branch - e o orchestrator PARA se algum repositorio divergiu.
  promotes: null

  # O que Rafinha pediu
  requested_scope: [geoprag_admin]

  # O que sobrou depois de resolver depends_on declarado no manifesto.
  # O orchestrator recalcula e falha se nao bater - o request nao pode "mentir".
  effective_scope: [geoprag_admin, geoprag_api]

  # Quem recebe versao NOVA (tag, e Release se for final)
  version_scope:
    geoprag_admin: 1.2.0-rc.1

  # Quem entra na distribuicao SEM versao nova: foi puxado por dependencia e
  # nao mudou nesta rodada. Precisa ter versao publicada e consumivel, senao
  # a release bloqueia (G3).
  carried:
    geoprag_api: 2.1.0

  ref: develop                       # base quando nao ha' promocao

  commits:                           # repositorio -> commit exato usado
    geoprag-admin: 9f2c1ab
    geoprag-api: 77be004

  issues:                            # componente -> issues incluidas
    geoprag_admin: [GEO-41, GEO-44]

  created_at: 2026-09-12T14:00:00Z
