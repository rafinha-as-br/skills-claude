# TEMPLATE DE RELEASE - Workflow Rafinha-Claude
#
# Copie para .github/workflows/release.yml no repositorio do projeto e
# adapte os pontos marcados com  [ADAPTAR].  O exemplo abaixo e' o do
# Compass System: tres componentes (uma API Maven e dois apps Flutter).
#
# Projeto de componente unico: apague os blocos dos componentes que nao
# existem. A estrutura (dispatch -> branch -> bump -> build -> artefatos
# -> tag/Release) vale igual, com um componente so'.
#
# O que NAO adaptar, porque e' convencao do workflow e nao detalhe do
# projeto:
#   - tag namespaced <componente>/vX.Y.Z
#   - um campo de versao por componente, vazio = pula o componente
#   - notas vindas de .github/release-notes/<comp>-<versao>.md, com
#     fallback para --generate-notes
#   - artefatos publicados ANTES de criar tags, para que uma falha na
#     publicacao nao leve junto os arquivos ja' buildados
#
# Depois de instalar:
#   1. O arquivo precisa existir na BRANCH PADRAO do repositorio, senao o
#      botao "Run workflow" nao aparece - restricao do GitHub. Num fluxo
#      develop -> main, ele vai nas duas.
#   2. Rodar uma vez com publish=false antes de considerar pronto.
#   3. Criar .github/release-components.yml (ver release-components.yml
#      nesta mesma pasta) e .github/release-notes/README.md.
#
# Ver: workflow-development-flow secao 10, e a pagina "9. Configurar o
# ciclo de Release" no Confluence.

name: Release

# Fechar uma versao: cria a release branch, faz o bump de cada componente que
# recebeu versao, builda os tres, publica os artefatos e cria uma tag/Release
# por componente. Deixe um campo de versao em branco para nao versionar
# aquele componente nesta rodada.
on:
  workflow_dispatch:
    inputs:
      # [ADAPTAR] um input por componente do projeto.
      routecraft_version:
        description: 'Versao do routecraft_app (ex.: 1.1.0) - vazio = nao versiona'
        required: false
        default: ''
      travel_matrix_version:
        description: 'Versao do travel_matrix (ex.: 1.1.0) - vazio = nao versiona'
        required: false
        default: ''
      api_version:
        description: 'Versao do compass-api (ex.: 0.1.0) - vazio = nao versiona'
        required: false
        default: ''
      publish:
        description: 'Criar tags e GitHub Releases ao final'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # [ADAPTAR] toolchains conforme os tipos de componente do projeto.
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: compass-api/pom.xml

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      # ---------------------------------------------------------------- branch
      - name: Criar a release branch
        id: branch
        run: |
          BRANCH="release/$(date +%Y-%m-%d)-${{ github.run_number }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------- bump
      # mvn versions:set em vez de sed: o pom.xml tem o <version> do
      # spring-boot-starter-parent antes do <version> do projeto.
      # [ADAPTAR] um bloco de bump por componente, no formato de versao
      # que a stack dele usa.
      - name: Bump das versoes
        run: |
          set -e
          if [ -n "${{ inputs.api_version }}" ]; then
            (cd compass-api && ./mvnw -B versions:set \
              -DnewVersion='${{ inputs.api_version }}' -DgenerateBackupPoms=false)
          fi
          if [ -n "${{ inputs.routecraft_version }}" ]; then
            sed -i "s/^version: .*/version: ${{ inputs.routecraft_version }}+${{ github.run_number }}/" \
              routecraft_app/pubspec.yaml
          fi
          if [ -n "${{ inputs.travel_matrix_version }}" ]; then
            sed -i "s/^version: .*/version: ${{ inputs.travel_matrix_version }}+${{ github.run_number }}/" \
              travel_matrix/pubspec.yaml
          fi
          git diff --stat

      - name: Commit e push da release branch
        run: |
          if git diff --quiet; then
            echo "Nenhum bump de versao nesta rodada."
          else
            git commit -am "release: bump de versao (run ${{ github.run_number }})"
          fi
          git push origin "${{ steps.branch.outputs.name }}"

      # ------------------------------------------------------------- builds
      # [ADAPTAR] um step de build por componente.
      - name: Build compass-api (jar)
        run: cd compass-api && ./mvnw -B package -DskipTests

      - name: Build routecraft_app (web + apk)
        run: |
          cd routecraft_app
          flutter pub get
          flutter build web --release
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk              build/app/outputs/flutter-apk/routecraft_app.apk

      - name: Build travel_matrix (web + apk)
        run: |
          cd travel_matrix
          flutter pub get
          flutter build web --release
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk              build/app/outputs/flutter-apk/travel_matrix.apk

      # [ADAPTAR] pacote de demo: especifico do Compass System. Num projeto
      # que nao precise de um bundle rodavel offline, apague este step e o
      # artefato correspondente.
      # -------------------------------------------------- pacote de demo
      - name: Montar o pacote de demo (compass-demo.zip)
        run: |
          set -e
          OUT=dist/compass-demo
          mkdir -p "$OUT/web" "$OUT/seed"
          cp -r routecraft_app/build/web "$OUT/web/routecraft"
          cp -r travel_matrix/build/web  "$OUT/web/travel_matrix"
          cp compass-api/scripts/seed_test_data.py "$OUT/seed/"

          {
            echo "Compass System - pacote de demonstracao"
            echo "execucao ${{ github.run_number }}  |  commit $(git rev-parse --short HEAD)"
            echo "gerado em $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "Versoes embarcadas neste pacote:"
            echo "  routecraft_app  $(grep '^version:' routecraft_app/pubspec.yaml | cut -d' ' -f2)"
            echo "  travel_matrix   $(grep '^version:' travel_matrix/pubspec.yaml | cut -d' ' -f2)"
            echo "  compass-api     $(basename compass-api/target/*.jar .jar | sed 's/^compass-system-//')"
            echo ""
            echo "Um componente sem versao nova nesta rodada aparece com a versao"
            echo "que ja' estava no repositorio."
          } > "$OUT/VERSOES.txt"
          cp deploy/demo/docker-compose.yml deploy/demo/nginx-spa.conf \
             deploy/demo/*.bat deploy/demo/LEIA-ME.md "$OUT/"

          docker build -t compass-demo/api:local compass-api
          docker pull postgres:15
          docker pull nginx:alpine
          docker save -o "$OUT/images.tar" compass-demo/api:local postgres:15 nginx:alpine

          (cd dist && zip -qr compass-demo.zip compass-demo)
          ls -lh dist/compass-demo.zip

      # ------------------------------------------------------------ artefatos
      # Sobem antes das tags: se a publicacao falhar, os arquivos ja estao la.
      - name: Publicar artefatos da rodada
        uses: actions/upload-artifact@v4
        with:
          name: compass-demo
          path: dist/compass-demo.zip
          retention-days: 30

      - name: Publicar artefatos por componente
        uses: actions/upload-artifact@v4
        with:
          name: componentes
          path: |
            compass-api/target/*.jar
            routecraft_app/build/app/outputs/flutter-apk/routecraft_app.apk
            travel_matrix/build/app/outputs/flutter-apk/travel_matrix.apk
          retention-days: 30

      # -------------------------------------------------- tags + releases
      - name: Criar tags e GitHub Releases
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # As notas da Release saem de .github/release-notes/<comp>-<versao>.md,
          # escrito pela jira-release-executor a partir do campo Resumo das
          # issues - texto corrido que qualquer pessoa entende, nao uma lista
          # de PRs. Sem o arquivo (dispatch manual, sem o Claude no circuito)
          # cai no --generate-notes automatico do GitHub.
          tag_and_release () {
            local comp="$1" version="$2"; shift 2
            [ -z "$version" ] && return 0
            local tag="$comp/v$version"
            local notes=".github/release-notes/$comp-$version.md"
            git tag -a "$tag" -m "$comp v$version"
            git push origin "$tag"
            if [ -f "$notes" ]; then
              echo "Release notes: $notes"
              gh release create "$tag" "$@" \
                --title "$comp v$version" \
                --target "${{ steps.branch.outputs.name }}" \
                --notes-file "$notes"
            else
              echo "Release notes: $notes nao existe, usando --generate-notes"
              gh release create "$tag" "$@" \
                --title "$comp v$version" \
                --target "${{ steps.branch.outputs.name }}" \
                --generate-notes
            fi
          }

          cd routecraft_app/build/web && zip -qr "$GITHUB_WORKSPACE/routecraft_app-web.zip" . && cd "$GITHUB_WORKSPACE"
          cd travel_matrix/build/web  && zip -qr "$GITHUB_WORKSPACE/travel_matrix-web.zip" . && cd "$GITHUB_WORKSPACE"

          tag_and_release compass-api "${{ inputs.api_version }}" compass-api/target/*.jar
          tag_and_release routecraft_app "${{ inputs.routecraft_version }}" routecraft_app-web.zip routecraft_app/build/app/outputs/flutter-apk/routecraft_app.apk
          tag_and_release travel_matrix "${{ inputs.travel_matrix_version }}" travel_matrix-web.zip travel_matrix/build/app/outputs/flutter-apk/travel_matrix.apk

      - name: Resumo
        run: |
          {
            echo "### Release"
            echo ""
            echo "- Branch: \`${{ steps.branch.outputs.name }}\`"
            echo "- routecraft_app: \`${{ inputs.routecraft_version || 'nao versionado' }}\`"
            echo "- travel_matrix: \`${{ inputs.travel_matrix_version || 'nao versionado' }}\`"
            echo "- compass-api: \`${{ inputs.api_version || 'nao versionado' }}\`"
            echo ""
            echo "Baixe o pacote rodavel no artefato **compass-demo** desta execucao."
          } >> "$GITHUB_STEP_SUMMARY"
