# TEMPLATE DE RELEASE - Workflow Rafinha-Claude
#
# Copie para .github/workflows/release.yml no repositorio do projeto e adapte
# os pontos marcados com  [ADAPTAR].  O exemplo usa dois componentes (uma API
# Maven e um app Flutter) so' para mostrar o formato com mais de um.
#
# Projeto de componente unico: apague os blocos que sobram. A estrutura
# (dispatch -> branch -> bump -> build -> artefato -> tag/Release) vale igual.
#
# O QUE NAO ADAPTAR - e' contrato do workflow, nao detalhe do projeto:
#   - os tres inputs: <componente>_version, release_type, publish
#   - nome do artefato: <componente>-<versao>, determinístico
#   - tag namespaced <componente>/vX.Y.Z[-rc.N]
#   - GitHub Release SO' em release_type=final (ver abaixo)
#   - notas de .github/release-notes/<comp>-<versao>.md, com fallback para a
#     versao base e depois para --generate-notes
#   - artefatos publicados ANTES de criar tags
#
# QUANDO SE CRIA GITHUB RELEASE
#   pre_release  -> tag + artefato, SEM Release  (nenhum rc polui a aba Releases)
#   final        -> tag + artefato + Release do componente (parcial ou completa)
#   distribuicao do produto (ZIP) -> NUNCA vira GitHub Release; vai para o
#                                    Drive e e' registrada no Confluence
#
# `publish` NAO e' um terceiro tipo de release. release_type responde "que tipo
# de versao estou produzindo"; publish responde "esta execucao publica?".
# publish=false builda e valida sem criar tag nem Release.
#
# ESTE WORKFLOW NAO MONTA A DISTRIBUICAO AGREGADA. Juntar artefatos de varios
# componentes, incluir o Runtime Package e gerar o ZIP e' trabalho do Release
# Orchestrator local (.release/scripts/), inclusive em monorepo.
#
# Depois de instalar:
#   1. O arquivo precisa existir na BRANCH PADRAO, senao o botao "Run workflow"
#      nao aparece - restricao do GitHub. Num fluxo develop -> main, vai nas duas.
#   2. Rodar uma vez com publish=false antes de considerar pronto.
#   3. Criar .release/project.yml (ver project.yml nesta pasta) e
#      .github/release-notes/README.md.
#
# Ver: workflow-development-flow/references/release-lifecycle.md secao 9.

name: Release

on:
  workflow_dispatch:
    inputs:
      # [ADAPTAR] um input por componente do repositorio. Vazio = fora da rodada.
      api_version:
        description: 'Versao do geoprag_api (ex.: 2.1.0 ou 2.1.0-rc.1) - vazio = nao versiona'
        required: false
        default: ''
      admin_version:
        description: 'Versao do geoprag_admin (ex.: 1.2.0 ou 1.2.0-rc.1) - vazio = nao versiona'
        required: false
        default: ''

      release_type:
        description: 'Tipo da versao produzida'
        type: choice
        options: [pre_release, final]
        default: pre_release
      publish:
        description: 'Criar tags e (em final) GitHub Releases'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # [ADAPTAR] toolchains conforme os tipos de componente do projeto.
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      # ---------------------------------------------------------------- branch
      - name: Criar a release branch
        id: branch
        run: |
          BRANCH="release/$(date +%Y-%m-%d)-${{ github.run_number }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------ bump
      # [ADAPTAR] um bloco por componente, no formato de versao da stack dele.
      # mvn versions:set em vez de sed: o pom.xml tem o <version> do parent
      # antes do <version> do projeto.
      - name: Bump das versoes
        run: |
          set -e
          if [ -n "${{ inputs.api_version }}" ]; then
            ./mvnw -B versions:set -DnewVersion='${{ inputs.api_version }}' -DgenerateBackupPoms=false
          fi
          if [ -n "${{ inputs.admin_version }}" ]; then
            sed -i "s/^version: .*/version: ${{ inputs.admin_version }}+${{ github.run_number }}/" pubspec.yaml
          fi
          git diff --stat

      - name: Commit e push da release branch
        run: |
          if git diff --quiet; then
            echo "Nenhum bump de versao nesta rodada."
          else
            git commit -am "release: bump de versao (run ${{ github.run_number }})"
          fi
          git push origin "${{ steps.branch.outputs.name }}"

      # ---------------------------------------------------------------- builds
      # [ADAPTAR] um step de build por componente. Rode so' o que tem versao.
      - name: Build geoprag_api (jar)
        if: inputs.api_version != ''
        run: ./mvnw -B package -DskipTests

      - name: Build geoprag_admin (web)
        if: inputs.admin_version != ''
        run: |
          flutter pub get
          flutter build web --release
          (cd build/web && zip -qr "$GITHUB_WORKSPACE/geoprag_admin-${{ inputs.admin_version }}.zip" .)

      # ------------------------------------------------------------- artefatos
      # Nome determinístico <componente>-<versao>: e' assim que o Orchestrator
      # acha o artefato sem adivinhar. Um upload por componente.
      #
      # Retencao: o artefato de uma PRE_RELEASE precisa sobreviver tempo
      # suficiente para a distribuicao ser montada e validada - depois disso,
      # quem guarda o rc e' o ZIP no Drive, nao o GitHub.
      - name: Publicar artefato de geoprag_api
        if: inputs.api_version != ''
        uses: actions/upload-artifact@v4
        with:
          name: geoprag_api-${{ inputs.api_version }}
          path: target/*.jar
          retention-days: 30

      - name: Publicar artefato de geoprag_admin
        if: inputs.admin_version != ''
        uses: actions/upload-artifact@v4
        with:
          name: geoprag_admin-${{ inputs.admin_version }}
          path: geoprag_admin-${{ inputs.admin_version }}.zip
          retention-days: 30

      # -------------------------------------------------- tags (+ Release em final)
      - name: Criar tags e, em release final, as GitHub Releases
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -e
          # A tag existe SEMPRE (inclusive em pre-release): e' ela que amarra
          # artefato <-> commit no release-manifest.yml da distribuicao.
          # A GitHub Release so' e' criada quando release_type=final.
          #
          # As notas saem de .github/release-notes/<comp>-<versao>.md, escrito
          # pela jira-release-executor a partir do campo Resumo das issues.
          # Fallback 1: <comp>-<versao-base>.md  (1.4.0 serve rc.1, rc.2 e final)
          # Fallback 2: --generate-notes do GitHub (pior resultado, mas funciona
          #             num dispatch manual sem o Claude no circuito)
          tag_and_release () {
            local comp="$1" version="$2"; shift 2
            [ -z "$version" ] && return 0

            local tag="$comp/v$version"
            git tag -a "$tag" -m "$comp v$version"
            git push origin "$tag"
            echo "tag criada: $tag"

            if [ "$RELEASE_TYPE" != "final" ]; then
              echo "release_type=$RELEASE_TYPE - sem GitHub Release, so' tag + artefato"
              return 0
            fi

            local base="${version%%-*}"
            local notes=".github/release-notes/$comp-$version.md"
            [ -f "$notes" ] || notes=".github/release-notes/$comp-$base.md"

            if [ -f "$notes" ]; then
              echo "Release notes: $notes"
              gh release create "$tag" "$@" \
                --title "$comp v$version" \
                --target "${{ steps.branch.outputs.name }}" \
                --notes-file "$notes"
            else
              echo "Sem arquivo de notas, usando --generate-notes"
              gh release create "$tag" "$@" \
                --title "$comp v$version" \
                --target "${{ steps.branch.outputs.name }}" \
                --generate-notes
            fi
          }

          # [ADAPTAR] uma chamada por componente, com os assets dele.
          tag_and_release geoprag_api   "${{ inputs.api_version }}"   target/*.jar
          tag_and_release geoprag_admin "${{ inputs.admin_version }}" "geoprag_admin-${{ inputs.admin_version }}.zip"

      - name: Resumo
        run: |
          {
            echo "### Release"
            echo ""
            echo "- Branch: \`${{ steps.branch.outputs.name }}\`"
            echo "- Tipo: \`${{ inputs.release_type }}\`  |  publish: \`${{ inputs.publish }}\`"
            echo ""
            echo "| Componente | Versao |"
            echo "| --- | --- |"
            echo "| geoprag_api | \`${{ inputs.api_version || 'nao versionado' }}\` |"
            echo "| geoprag_admin | \`${{ inputs.admin_version || 'nao versionado' }}\` |"
            echo ""
            if [ "${{ inputs.release_type }}" = "final" ]; then
              echo "GitHub Releases criadas para os componentes versionados."
            else
              echo "Pre-release: tags e artefatos criados, sem GitHub Release."
            fi
            echo ""
            echo "A distribuicao agregada (ZIP com runtime) e' montada pelo"
            echo "Release Orchestrator local, nao por este workflow."
          } >> "$GITHUB_STEP_SUMMARY"
