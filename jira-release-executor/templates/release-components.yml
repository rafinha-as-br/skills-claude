# TEMPLATE - Manifesto de componentes versionáveis
#
# Copie para .github/release-components.yml no repositório do projeto.
#
# Fica em .github/ e NÃO em .claude/ porque .claude/ está no .gitignore
# dos projetos (guarda execution-state e settings locais) — um manifesto
# lá nunca seria commitado, e nem a Action nem um clone novo o enxergariam.
#
# Quem consome é a skill jira-release-executor: é daqui que ela sabe o que
# versionar, como filtrar escopo quando Rafinha pede um componente só, e
# como mapear issue -> componente (casando o `path` com os arquivos do PR).
#
# Os steps de build do release.yml são escritos por componente e mantidos
# em sincronia com este arquivo MANUALMENTE — buildar Maven e buildar
# Flutter são comandos diferentes, então o workflow não é orientado pelo
# manifesto. Divergência entre os dois é bug, e a skill deve parar e avisar.

components:
  # Projeto de artefato único declara UM componente. Mesmo formato, sem
  # caso especial — apague os demais blocos.

  - name: compass-api            # prefixo da tag e do nome da Fix Version
    path: compass-api            # casa com os arquivos do PR -> componente
    type: maven                  # maven | flutter | node | ...
    version_file: compass-api/pom.xml
    dispatch_input: api_version  # qual input do workflow_dispatch é este

  - name: routecraft_app
    path: routecraft_app
    type: flutter
    version_file: routecraft_app/pubspec.yaml
    dispatch_input: routecraft_version

  - name: travel_matrix
    path: travel_matrix
    type: flutter
    version_file: travel_matrix/pubspec.yaml
    dispatch_input: travel_matrix_version

# Monorepo? Um componente por artefato buildável independente.
# Repo de um app só? Um componente, `path: .`
